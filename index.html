<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dvojiška števila – pretvorba v desetiško število</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
    }
    .controls {
      margin-top: 20px;
    }
    .controls button {
      margin: 5px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: border-color 0.3s, background-color 0.3s;
    }
    .controls button.active {
      border-color: #007acc;
      background-color: #e6f2ff;
    }
    .binary-display {
      display: flex;
      justify-content: center;
      gap: 5px;
      margin-top: 30px;
    }
    .bit-box {
      border: 2px solid #000;
      padding: 10px;
      font-size: 24px;
      min-width: 30px;
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f0f0f0;
    }
    #answer-box {
      margin-top: 20px;
    }
    #check-button {
      margin-top: 15px;
      padding: 10px 20px;
      font-size: 18px;
      cursor: pointer;
    }
    #feedback {
      margin-top: 15px;
      font-size: 18px;
    }
    #next-info {
      margin-top: 5px;
      font-size: 16px;
      color: #555;
    }
    #summary {
      margin-top: 40px;
      max-width: 700px;
      margin-left: auto;
      margin-right: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    table, th, td {
      border: 1px solid #999;
    }
    th, td {
      padding: 10px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Pretvarjanje dvojiških števil v desetiški zapis</h1>
  <p>Pretvori prikazano dvojiško število v desetiški zapis. Rezultat lahko potrdiš s tipko <strong>Enter</strong> ali klikom na gumb.</p>

  <div class="controls">
    <p>Izberi število nalog:</p>
    <button onclick="setTaskCount(5, this)">5</button>
    <button onclick="setTaskCount(10, this)">10</button>
    <button onclick="setTaskCount(15, this)">15</button>

    <p>Izberi obseg števil:</p>
    <button onclick="setRange(15, this)">1–15</button>
    <button onclick="setRange(31, this)">1–31</button>
    <button onclick="setRange(63, this)">1–63</button>
    <button onclick="setRange(127, this)">1–127</button>
  </div>

  <div id="task-area" style="display:none;">
    <h2>Naloga <span id="task-number"></span> / <span id="total-tasks"></span></h2>
    <div class="binary-display" id="binary-display"></div>

    <div id="answer-box">
      <label for="user-answer">Tvoj odgovor (decimalno): </label>
      <input type="number" id="user-answer" value="">
      <button id="check-button">Preveri</button>
    </div>
    <p id="feedback"></p>
    <p id="next-info"></p>
  </div>

  <div id="summary"></div>

  <script>
    let totalTasks = 0;
    let maxValue = 0;
    let currentTask = 0;
    let currentNumber = 0;
    let results = [];

    function setTaskCount(count, btn) {
      totalTasks = count;
      document.getElementById("summary").innerHTML = "";
      document.querySelectorAll(".controls p:nth-of-type(1) + button, .controls p:nth-of-type(1) ~ button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
    }

    function setRange(max, btn) {
      if (totalTasks === 0) {
        alert("Najprej izberi število nalog.");
        return;
      }
      maxValue = max;
      document.querySelectorAll(".controls p:nth-of-type(2) + button, .controls p:nth-of-type(2) ~ button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      startChallenge();
    }

    function startChallenge() {
      currentTask = 0;
      results = [];
      document.getElementById("total-tasks").textContent = totalTasks;
      document.getElementById("task-area").style.display = "block";
      nextTask();
    }

    function nextTask() {
      currentTask++;
      if (currentTask > totalTasks) {
        showSummary();
        return;
      }

      currentNumber = Math.floor(Math.random() * maxValue) + 1;
      const binary = currentNumber.toString(2).padStart(Math.ceil(Math.log2(maxValue + 1)), "0");

      document.getElementById("task-number").textContent = currentTask;
      const answerInput = document.getElementById("user-answer");
      answerInput.value = "";
      document.getElementById("feedback").textContent = "";
      document.getElementById("next-info").textContent = "";

      const display = document.getElementById("binary-display");
      display.innerHTML = "";
      for (const bit of binary) {
        const box = document.createElement("div");
        box.className = "bit-box";
        box.textContent = bit;
        display.appendChild(box);
      }

      answerInput.focus();
    }

    function checkAnswer() {
      const input = parseInt(document.getElementById("user-answer").value);
      const feedback = document.getElementById("feedback");
      const nextInfo = document.getElementById("next-info");
      const binary = currentNumber.toString(2).padStart(Math.ceil(Math.log2(maxValue + 1)), "0");

      if (isNaN(input)) {
        feedback.textContent = '⛔ Vpiši število!';
        feedback.style.color = 'orange';
        nextInfo.textContent = "";
        return;
      }

      const correct = input === currentNumber;
      results.push({
        task: currentTask,
        binary: binary,
        user: input,
        expected: currentNumber,
        correct: correct
      });

      feedback.textContent = correct ? '✅ Pravilen odgovor!' : `❌ Napačno. Pravilni odgovor je ${currentNumber}.`;
      feedback.style.color = correct ? 'green' : 'red';
      nextInfo.textContent = "";

      if (currentTask < totalTasks) {
        let countdown = 2;
        nextInfo.textContent = `Nova naloga čez ${countdown}…`;
        const interval = setInterval(() => {
          countdown--;
          if (countdown > 0) {
            nextInfo.textContent = `Nova naloga čez ${countdown}…`;
          } else {
            clearInterval(interval);
            nextInfo.textContent = "";
            nextTask();
          }
        }, 1000);
      } else {
        setTimeout(showSummary, 1500);
      }
    }

    document.getElementById("check-button").onclick = checkAnswer;
    document.getElementById("user-answer").addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        event.preventDefault();
        checkAnswer();
      }
    });

    function showSummary() {
      const summary = document.getElementById("summary");
      let html = `<h2>Povzetek rezultatov</h2>`;
      html += `<table><tr><th>Naloga</th><th>Dvojiško</th><th>Tvoj odgovor</th><th>Rezultat</th><th>Pravilno</th></tr>`;
      results.forEach(r => {
        html += `<tr>
          <td>${r.task}</td>
          <td>${r.binary}</td>
          <td>${r.user}</td>
          <td>${r.correct ? "✅" : "❌"}</td>
          <td>${r.expected}</td>
        </tr>`;
      });
      const correctCount = results.filter(r => r.correct).length;
      html += `</table><p><strong>Pravilnih odgovorov: ${correctCount} od ${totalTasks}</strong></p>`;
      summary.innerHTML = html;
      document.getElementById("task-area").style.display = "none";
    }
  </script>
</body>
</html>
